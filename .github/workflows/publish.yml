name: Publish

# Publishing is separate from the release workflow on purpose. A release builds binaries and can be
# rerun as often as anybody likes. A publish is permanent: crates.io does not let a version be taken
# back, only yanked, so this one is triggered by hand and does a dry run first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, without the leading v
        required: true
        type: string
      dry_run:
        description: Package every crate and upload the wheels to TestPyPI, touching neither real index
        required: false
        default: true
        type: boolean
      # A patch is work in the middle of a milestone and does not go to crates.io, which is the rule
      # in docs/RELEASING.md, and before this input the only way to honour it while still shipping a
      # wheel was to remember not to press the button. A run says which indexes it is for.
      registries:
        description: Which indexes this run is for
        required: true
        default: both
        type: choice
        options:
          - both
          - crates-io
          - pypi

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  publish:
    name: Publish to crates.io
    if: ${{ inputs.registries != 'pypi' }}
    runs-on: ubuntu-24.04
    # The first publish of this workspace has to wait out the crates.io limit on new names, which is
    # roughly ten minutes each once the initial burst is used up. Every publish after it is quick.
    timeout-minutes: 180
    environment: crates-io
    steps:
      # The tag, not the branch. A version is one tree, and checking out whatever the default branch
      # happens to be at the moment somebody presses the button is how it stops being one: a run that
      # gets partway through, followed by more merges, followed by a rerun, publishes the first half
      # of a version from one commit and the second half from another. That is not a hypothetical.
      # 0.2.0 went out that way, with iris-guard published from a commit ten minutes before the
      # commit that implemented it, and crates.io does not let a version be taken back.
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      # No cache here on purpose. This workflow runs a handful of times per release, so the few
      # minutes a cache saves are not worth much, and the cache action's cleanup walks target/, which
      # by that point contains the unpacked copies cargo package left behind. It tries to tidy them,
      # finds they have moved, and files a dozen red annotations on a run that succeeded. Red on this
      # workflow needs to mean something.

      # A version that does not match the tree is the one mistake this workflow cannot undo, so it
      # is checked before anything is uploaded rather than discovered halfway through. With the tag
      # checked out this catches a tag put on the wrong commit, which is the way it can still go
      # wrong now that it cannot go wrong by the branch moving.
      - name: The version has to match the workspace
        run: |
          set -euo pipefail
          declared=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "the workspace is at $declared and this run asked for ${{ inputs.version }}"
            exit 1
          fi
          echo "publishing $declared"

      - name: Everything has to build and test first
        run: |
          cargo build --workspace --all-targets --locked
          cargo test --workspace --locked

      - name: Dry run
        run: ci/publish.sh "${{ inputs.version }}" --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ci/publish.sh "${{ inputs.version }}"

  # The wheels are not rebuilt here. They are downloaded from the release the tag produced, which is
  # the only way to be sure that what lands on PyPI is what the clean machine job installed and ran
  # the tests against. A wheel built a second time from the same tree would probably be the same
  # wheel, and probably is not the word wanted on the one step that cannot be undone.
  pypi:
    name: Publish to PyPI
    if: ${{ inputs.registries != 'crates-io' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Fetch the wheels from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p wheels
          gh release download "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" --pattern '*.whl' --dir wheels
          ls -l wheels
          # Five platforms, and a run that quietly uploaded three of them would leave the other two
          # installing from source on machines that have no Rust, which is the failure this whole
          # milestone is about.
          count=$(find wheels -name '*.whl' | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "expected five wheels on that release and found $count" >&2
            exit 1
          fi
      - name: Check them
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check wheels/*.whl

      # A dry run uploads to TestPyPI, which is the whole point of TestPyPI and is worth more than
      # a metadata check. It exercises the credential, the endpoint, the metadata PyPI actually
      # validates and the five filenames, so the real upload is a rehearsed step rather than a first
      # attempt. `skip-existing` is on because a dry run gets rerun and a version there is as
      # permanent as a version anywhere else.
      #
      # Both steps below say `release/v1` rather than `v1`, because this is the one action here that
      # does not tag a major version. That branch is the channel its own documentation points at.
      - name: Rehearse it on TestPyPI
        if: ${{ inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          skip-existing: true
          print-hash: true

      # The official action rather than a twine invocation, because it is the one thing in this file
      # that PyPI itself maintains against its own API, and because moving to trusted publishing
      # later means deleting the `password` line and adding `id-token: write` rather than rewriting
      # the step. Attestations need that move: they are signed with the OIDC identity of this job and
      # an API token cannot produce one.
      - name: Upload
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          password: ${{ secrets.PYPI_TOKEN }}
          print-hash: true
