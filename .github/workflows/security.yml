name: Security

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    # Advisories land after a pull request is merged, so this has to run on a
    # clock and not only on change.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: Licences, advisories and bans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  audit:
    name: Advisory database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate
          license-check: true
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, Unicode-3.0, Zlib, MPL-2.0, CC0-1.0, BSL-1.0
          # The licence check is about what ends up in the artifacts we publish. A
          # GitHub Action runs on a build machine and nothing it contains is linked
          # into anything we ship, so its licence is not the same question. This
          # cache action is LGPL-3.0 and that is fine where it sits.
          allow-dependencies-licenses: pkg:githubactions/Swatinem/rust-cache

  # The actions analysis takes about forty seconds and catches the thing a workflow change is most
  # likely to get wrong, so it runs on every pull request. The rust analysis takes six minutes,
  # which was the longest thing standing between a pull request and a merge, and on a tree this size
  # it has yet to say anything clippy did not. It runs on the default branch and on the nightly
  # clock instead, so nothing merges without it having been run, it is just not run twice.
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && fromJSON('["actions"]') || fromJSON('["actions", "rust"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Actions here are pinned to a major version tag rather than to a commit hash, and Scorecard's
  # pinned dependencies check marks that down. The tradeoff is deliberate. A tag means a fix in an
  # action reaches this repository the day it ships. A hash means it reaches it whenever somebody
  # gets around to merging the dependabot pull request, and in the meantime the workflow is pinned
  # to a version that is known to be worse. Every action used here comes from GitHub, from OpenSSF,
  # or from a Rust tooling maintainer whose toolchain we already run, and a major tag on those does
  # not move without a release behind it.
  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
