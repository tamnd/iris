name: Fleet

# The hosted runners are shared machines, which is fine for a build and is not fine for a number.
# These are not shared. They are four boxes nobody else is on, and they exist in this workflow for
# two reasons: to run the suite on hardware whose neighbours are not a variable, and to settle the
# M0 window refill question, which currently reads as an architecture result and may only be a
# shared runner result.
#
# Nothing here runs on a pull request, and that is a security property rather than an oversight. A
# self hosted runner executes whatever the workflow tells it to, so letting a pull request from a
# fork reach one hands an arbitrary person a shell on a machine we own. Push to the default branch,
# a schedule, and a manual dispatch are all trusted inputs. A fork's pull request is not.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Named for what they are. A hostname tells a reader nothing they can compare against and
          # a role name tells them nothing about why a number came out the way it did, so the label
          # is the hardware: what the chip is and how much of it there is.
          - name: epyc-4c-6gb
            runner: [self-hosted, linux, x64, epyc-4c-6gb]
          - name: epyc-6c-12gb
            runner: [self-hosted, linux, x64, epyc-6c-12gb]
          - name: epyc-8c-24gb
            runner: [self-hosted, linux, x64, epyc-8c-24gb]
          - name: i9-13900k-64gb
            runner: [self-hosted, windows, x64, i9-13900k-64gb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The hosted runners come with a toolchain. These do not, so the workflow puts one there and
      # pins it to the same version the toolchain file names.
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Doc tests
        run: cargo test --workspace --doc --locked

      - name: Guest crates still build for wasm32
        run: cargo build --locked --target wasm32-unknown-unknown -p iris-abi -p iris-decoder --lib --examples

  # The M0 probe, on the one machine in the fleet whose timings mean anything.
  #
  # Bet two passed on every aarch64 machine and failed on every x86-64 one, and every failing row was
  # a shared hosted runner, which leaves two explanations: the architecture, or the neighbours. This
  # job separates them, and it runs on exactly one machine because only one of ours is eligible.
  #
  # The three EPYC boxes are shared tenancy virtual machines. The guest cannot set the frequency
  # governor, cannot disable turbo, cannot pin to a physical core and cannot see what a neighbour is
  # doing, so a duration measured on one is not evidence about anything. They run the suite above,
  # which is a correctness question, and they do not run this. The rule and the reasoning are in the
  # iris-bench machine notes and this workflow follows them rather than restating them.
  probe:
    name: M0 probe on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: i9-13900k-64gb
            runner: [self-hosted, windows, x64, i9-13900k-64gb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install

      - name: Run the probe
        run: cargo run --release --locked -p iris-vm --example m0_probe -- --json > probe-${{ matrix.name }}.json

      - name: Show it
        shell: bash
        run: cat probe-${{ matrix.name }}.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-${{ matrix.name }}
          path: probe-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: error
