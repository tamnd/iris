name: Fleet

# The hosted runners are shared machines, which is fine for a build and is not fine for a number.
# These are ours, and they exist in this workflow for two reasons: to run the suite on hardware whose
# neighbours are not a variable, and to settle the M0 window refill question, which reads as an
# architecture result and may only be a shared runner result.
#
# Three machines, not four. The fourth is a four core box with six gigabytes that is already a
# Kubernetes node, and it sits at a load average around fifty with about a hundred megabytes free. A
# build there would take hours, thrash, and slow down the thing the machine is actually for, which is
# the opposite of what a fleet whose whole point is hardware with no neighbours should be doing. Its
# runner is gone rather than idle, so that what is registered and what is used are the same list.
#
# Nothing here runs on a pull request, and that is a security property rather than an oversight. A
# self hosted runner executes whatever the workflow tells it to, so letting a pull request from a
# fork reach one hands an arbitrary person a shell on a machine we own. Push to the default branch,
# a schedule, and a manual dispatch are all trusted inputs. A fork's pull request is not.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      sweep:
        description: "Also repeat the probe across window sizes, to see whether the cost depends on one"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fleet-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Named for what they are. A hostname tells a reader nothing they can compare against and
          # a role name tells them nothing about why a number came out the way it did, so the label
          # is the hardware: what the chip is and how much of it there is.
          #
          # jobs is set per machine rather than left to cargo, which sizes itself by core count and
          # not by memory. Building wasmtime wants well over a gigabyte per job, and the smaller box
          # here has less headroom than that times its core count.
          - name: epyc-6c-12gb
            runner: [self-hosted, linux, x64, epyc-6c-12gb]
            jobs: 4
          - name: epyc-8c-24gb
            runner: [self-hosted, linux, x64, epyc-8c-24gb]
            jobs: 6
          - name: i9-13900k-64gb
            runner: [self-hosted, windows, x64, i9-13900k-64gb]
            jobs: 16
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The hosted runners come with a toolchain. These do not, so the workflow puts one there and
      # pins it to the same version the toolchain file names.
      #
      # There are two copies of this because the Windows one cannot use bash. `shell: bash` resolves
      # bash through PATH, and on a Windows machine that has WSL enabled but no distribution
      # installed that finds the WSL launcher in system32 rather than the bash that comes with git,
      # which then fails with a message about installing a distribution. Which one wins depends on
      # how that machine's PATH happens to be ordered, and a workflow that depends on that is a
      # workflow that breaks the next time somebody installs something. PowerShell is unambiguous.
      - name: Toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/toolchain.ps1 -Wasm

      # No separate build step. `cargo test --all-targets` builds everything this would have built,
      # so a build step ahead of it is a second pass over the same crates for the sake of a nicer
      # failure message, and on the smaller machines here that is minutes rather than seconds.
      - name: Test
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
        run: cargo test --workspace --all-targets --locked

      - name: Doc tests
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
        run: cargo test --workspace --doc --locked

      - name: Guest crates still build for wasm32
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
        run: cargo build --locked --target wasm32-unknown-unknown -p iris-abi -p iris-decoder --lib --examples

  # The M0 probe, on the one machine in the fleet whose timings mean anything.
  #
  # Bet two passed on every aarch64 machine and failed on every x86-64 one, and every failing row was
  # a shared hosted runner, which leaves two explanations: the architecture, or the neighbours. This
  # job separates them, and it runs on exactly one machine because only one of ours is eligible.
  #
  # The EPYC boxes are shared tenancy virtual machines. The guest cannot set the frequency governor,
  # cannot disable turbo, cannot pin to a physical core and cannot see what a neighbour is doing, so
  # a duration measured on one is not evidence about anything. They run the suite above, which is a
  # correctness question, and they do not run this. The rule and the reasoning are in the iris-bench
  # machine notes and this workflow follows them rather than restating them.
  probe:
    name: M0 probe on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: i9-13900k-64gb
            runner: [self-hosted, windows, x64, i9-13900k-64gb]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only the Windows machine is eligible for this job, so there is only the PowerShell copy here.
      - name: Toolchain
        shell: pwsh
        run: ./ci/toolchain.ps1

      # Six runs, not one, and the reason is the whole finding of issue #65.
      #
      # A single run reports a confidence interval taken from the samples inside it. That interval is
      # the wrong one to judge a three percent gate by. The flat scan and the windowed scan are
      # measured one after the other, so anything that moves the machine between the two blocks lands
      # entirely in the difference between them, and an interval computed inside a block cannot see
      # it by construction. What it describes is how consistent the samples were while the block was
      # running, which is not the question being asked.
      #
      # On this machine that matters more than it sounds. Twenty four runs in one sitting put the
      # windowed overhead anywhere between minus eight and plus eighteen percent, and the flat scan
      # alone moved by a third across an hour on an idle machine nobody else is using. So what gets
      # published is a median across whole runs with the spread taken across them, and six is the
      # number that fits in the time this job already takes.
      - name: Run the probe
        shell: pwsh
        run: |
          foreach ($rep in 1..6) {
            $out = "probe-$rep-${{ matrix.name }}.json"
            cargo run --release --locked -q -p iris-vm --example m0_probe -- --json > $out
            Get-Content $out
          }

      # Only when a dispatch asks for it, because it is another twenty four runs and the answer only
      # moves when the probe or the scan crate does.
      #
      # This adds the window size as a second dimension, to settle whether the overhead depends on it
      # at all. The repeats are interleaved rather than blocked, so that drift over the quarter hour
      # it takes spreads across all four sizes instead of landing on whichever size was being
      # measured when it happened.
      - name: Whether the window cost depends on the window
        if: inputs.sweep
        shell: pwsh
        run: |
          foreach ($rep in 1..6) {
            foreach ($w in 4, 16, 32, 128) {
              $out = "sweep-$w-$rep-${{ matrix.name }}.json"
              cargo run --release --locked -q -p iris-vm --example m0_probe -- --json --samples 25 --mib 256 --window-mib $w > $out
              Get-Content $out
            }
          }

      - uses: actions/upload-artifact@v7
        if: inputs.sweep
        with:
          name: sweep-${{ matrix.name }}
          path: sweep-*-*-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.name }}
          path: probe-*-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: error

  # The guard cost probe, on the same one machine and for the same reason.
  #
  # This is the run the published number comes from. The hosted matrix in the M2 probe workflow says
  # whether the answer changes character across architectures, which is a question a shared machine
  # can still answer, and a share of a ratio measured next to a neighbour doing something unknown is
  # not a number anybody should quote.
  guard:
    name: Guard cost on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: i9-13900k-64gb
            runner: [self-hosted, windows, x64, i9-13900k-64gb]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        shell: pwsh
        run: ./ci/toolchain.ps1

      - name: Run the probe
        shell: pwsh
        run: |
          cargo run --release --locked -p iris-runtime --features probe --example guard_cost -- --json --samples 1000 > guard-cost-${{ matrix.name }}.json

      - name: Show it
        shell: pwsh
        run: |
          cargo run --release --locked -p iris-runtime --features probe --example guard_cost -- --samples 1000

      - uses: actions/upload-artifact@v7
        with:
          name: guard-cost-${{ matrix.name }}
          path: guard-cost-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: error
