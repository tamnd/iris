name: Fleet

# The hosted runners are shared machines, which is fine for a build and is not fine for a number.
# These are ours, and they exist in this workflow for two reasons: to run the suite on hardware whose
# neighbours are not a variable, and to settle the M0 window refill question, which reads as an
# architecture result and may only be a shared runner result.
#
# Three machines, not four. The fourth is a four core box with six gigabytes that is already a
# Kubernetes node, and it sits at a load average around fifty with about a hundred megabytes free. A
# build there would take hours, thrash, and slow down the thing the machine is actually for, which is
# the opposite of what a fleet whose whole point is hardware with no neighbours should be doing. Its
# runner is gone rather than idle, so that what is registered and what is used are the same list.
#
# Nothing here runs on a pull request, and that is a security property rather than an oversight. A
# self hosted runner executes whatever the workflow tells it to, so letting a pull request from a
# fork reach one hands an arbitrary person a shell on a machine we own. Push to the default branch,
# a schedule, and a manual dispatch are all trusted inputs. A fork's pull request is not.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      sweep:
        description: "Also repeat the probe across window sizes, to see whether the cost depends on one"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fleet-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Named for what they are. A hostname tells a reader nothing they can compare against and
          # a role name tells them nothing about why a number came out the way it did, so the label
          # is the hardware: what the chip is and how much of it there is.
          #
          # jobs is set per machine rather than left to cargo, which sizes itself by core count and
          # not by memory. Building wasmtime wants well over a gigabyte per job, and the smaller box
          # here has less headroom than that times its core count.
          - name: epyc-6c-12gb
            runner: [self-hosted, linux, x64, epyc-6c-12gb]
            jobs: 4
          - name: epyc-8c-24gb
            runner: [self-hosted, linux, x64, epyc-8c-24gb]
            jobs: 6
          - name: i9-13900k-64gb
            runner: [self-hosted, windows, x64, i9-13900k-64gb]
            jobs: 16
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The hosted runners come with a toolchain. These do not, so the workflow puts one there and
      # pins it to the same version the toolchain file names.
      #
      # There are two copies of this because the Windows one cannot use bash. `shell: bash` resolves
      # bash through PATH, and on a Windows machine that has WSL enabled but no distribution
      # installed that finds the WSL launcher in system32 rather than the bash that comes with git,
      # which then fails with a message about installing a distribution. Which one wins depends on
      # how that machine's PATH happens to be ordered, and a workflow that depends on that is a
      # workflow that breaks the next time somebody installs something. PowerShell is unambiguous.
      - name: Toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/toolchain.ps1 -Wasm

      # No separate build step. `cargo test --all-targets` builds everything this would have built,
      # so a build step ahead of it is a second pass over the same crates for the sake of a nicer
      # failure message, and on the smaller machines here that is minutes rather than seconds.
      - name: Test
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
        run: cargo test --workspace --all-targets --locked

      - name: Doc tests
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
        run: cargo test --workspace --doc --locked

      - name: Guest crates still build for wasm32
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
        run: cargo build --locked --target wasm32-unknown-unknown -p iris-abi -p iris-decoder --lib --examples

  # The M4 gate, which is the one test in this tree that needs a real disk.
  #
  # It writes a container whose data section is a little over four gigabytes and reads rows from
  # past that mark through a window a sixteenth of its size. Four gigabytes is the wasm32 address
  # space and therefore the ceiling in the prior art, and the point of the test is that the ceiling
  # is on what a decoder can hold rather than on what it can read. It is `#[ignore]`d in the tree so
  # that no hosted runner ever writes four gigabytes, and it is named here rather than run with a
  # bare `--ignored` so that adding a second slow test does not silently add it to this job.
  #
  # Both platforms, because what moves under the decoder here is a memory mapping and the two
  # operating systems do not move one the same way. The twelve gigabyte machine is left out: the
  # fixture is built in memory before it is written, so the peak is the fixture plus the toolchain
  # that is still resident, and that box has other things to be getting on with.
  window:
    name: Four gigabyte gate on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: epyc-8c-24gb
            runner: [self-hosted, linux, x64, epyc-8c-24gb]
            jobs: 6
          - name: i9-13900k-64gb
            runner: [self-hosted, windows, x64, i9-13900k-64gb]
            jobs: 16
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/toolchain.ps1 -Wasm

      - name: A file larger than the guest can address
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
        run: >-
          cargo test --locked -p iris-runtime --test windowed --
          --ignored --exact
          a_dataset_larger_than_four_gibibytes_reads_through_a_window_a_fraction_of_its_size

      # The test removes its own fixture on the way out, including when it fails, because a guard
      # that runs on unwind is the only kind that helps. This is for the run that does not get to
      # unwind at all, where a self hosted machine would otherwise keep four gigabytes until somebody
      # noticed.
      - name: Clean up after a run that did not
        if: always() && runner.os != 'Windows'
        shell: bash
        run: rm -rf target/gate-window

      - name: Clean up after a run that did not
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue target/gate-window

  # The M0 probe, on the one machine in the fleet whose timings mean anything.
  #
  # Bet two passed on every aarch64 machine and failed on every x86-64 one, and every failing row was
  # a shared hosted runner, which leaves two explanations: the architecture, or the neighbours. This
  # job separates them, and it runs on exactly one machine because only one of ours is eligible.
  #
  # The EPYC boxes are shared tenancy virtual machines. The guest cannot set the frequency governor,
  # cannot disable turbo, cannot pin to a physical core and cannot see what a neighbour is doing, so
  # a duration measured on one is not evidence about anything. They run the suite above, which is a
  # correctness question, and they do not run this. The rule and the reasoning are in the iris-bench
  # machine notes and this workflow follows them rather than restating them.
  probe:
    name: M0 probe on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: i9-13900k-64gb
            runner: [self-hosted, windows, x64, i9-13900k-64gb]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only the Windows machine is eligible for this job, so there is only the PowerShell copy here.
      - name: Toolchain
        shell: pwsh
        run: ./ci/toolchain.ps1

      # Six runs, not one, and the reason is the whole finding of issue #65.
      #
      # A single run reports a confidence interval taken from the samples inside it. That interval is
      # the wrong one to judge a three percent gate by. The flat scan and the windowed scan are
      # measured one after the other, so anything that moves the machine between the two blocks lands
      # entirely in the difference between them, and an interval computed inside a block cannot see
      # it by construction. What it describes is how consistent the samples were while the block was
      # running, which is not the question being asked.
      #
      # On this machine that matters more than it sounds. Twenty four runs in one sitting put the
      # windowed overhead anywhere between minus eight and plus eighteen percent, and the flat scan
      # alone moved by a third across an hour on an idle machine nobody else is using. So what gets
      # published is a median across whole runs with the spread taken across them, and six is the
      # number that fits in the time this job already takes.
      - name: Run the probe
        shell: pwsh
        run: |
          foreach ($rep in 1..6) {
            $out = "probe-$rep-${{ matrix.name }}.json"
            cargo run --release --locked -q -p iris-vm --example m0_probe -- --json > $out
            Get-Content $out
          }

      # Only when a dispatch asks for it, because it is another twenty four runs and the answer only
      # moves when the probe or the scan crate does.
      #
      # This adds the window size as a second dimension, to settle whether the overhead depends on it
      # at all. The repeats are interleaved rather than blocked, so that drift over the quarter hour
      # it takes spreads across all four sizes instead of landing on whichever size was being
      # measured when it happened.
      - name: Whether the window cost depends on the window
        if: inputs.sweep
        shell: pwsh
        run: |
          foreach ($rep in 1..6) {
            foreach ($w in 4, 16, 32, 128) {
              $out = "sweep-$w-$rep-${{ matrix.name }}.json"
              cargo run --release --locked -q -p iris-vm --example m0_probe -- --json --samples 25 --mib 256 --window-mib $w > $out
              Get-Content $out
            }
          }

      - uses: actions/upload-artifact@v7
        if: inputs.sweep
        with:
          name: sweep-${{ matrix.name }}
          path: sweep-*-*-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.name }}
          path: probe-*-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: error

  # The M5 vectorisation comparison, which is the probe behind issue #32.
  #
  # The hosted matrix in the M5 probe workflow is what makes this an architecture result, because the
  # fleet is entirely x86-64 and instruction counts from a simulator are comparable across machines
  # in a way durations are not. What this job adds is the half a simulator cannot give: durations
  # from a machine with no neighbour, and instructions per cycle from a real performance monitoring
  # unit. A guest that runs the same instructions as the host and takes longer is a different finding
  # from a guest that runs more of them, and only a counter can tell those apart.
  #
  # Two tunings, in two target directories. RUSTFLAGS invalidates a target directory, so sharing one
  # would mean rebuilding the world on the second pass and then again on the next run.
  vectorisation:
    name: Vectorisation on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: epyc-8c-24gb
            runner: [self-hosted, linux, x64, epyc-8c-24gb]
            jobs: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # Says what it could read before anything reads it, so a run that produced no counters says why
      # in its own log rather than in a reader's guess.
      - name: What this machine will let a process count
        shell: bash
        run: |
          cat /proc/sys/kernel/perf_event_paranoid || true
          perf stat -e instructions,cycles -x, true || true

      - name: Run the probe at both tunings
        shell: bash
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
        run: |
          set -euo pipefail
          for tuning in baseline native; do
            if [ "$tuning" = native ]; then
              export RUSTFLAGS="-C target-cpu=native"
            else
              unset RUSTFLAGS
            fi
            export CARGO_TARGET_DIR="$PWD/target-$tuning"
            cargo build --release --locked -p iris-vm --example m5_vector
            "$CARGO_TARGET_DIR/release/examples/m5_vector" --repeats 400
            "$CARGO_TARGET_DIR/release/examples/m5_vector" --repeats 400 --json \
              > "vector-${{ matrix.name }}-$tuning.json"
            for case in int-bp dbl-pseudodecimal str-fsst; do
              python3 ci/vector_counters.py --cases "$case" \
                --json-out "counters-${{ matrix.name }}-$tuning-$case.json" || true
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: vector-${{ matrix.name }}
          path: |
            vector-${{ matrix.name }}-*.json
            counters-${{ matrix.name }}-*.json
          retention-days: 30
          if-no-files-found: error

  # The M5 remote scan comparison, which is the probe behind issue #31.
  #
  # A different machine from the two probes above, and on purpose. What this one publishes is request
  # counts and byte counts, and those are the same whatever else the box is doing, so the argument
  # that keeps a duration off a shared tenancy virtual machine does not apply to them. What it does
  # apply to is the millisecond column, which is why the write up takes its durations from a machine
  # with no neighbours and takes the counters from here. The Linux run also answers a question the
  # write up would otherwise have to hand wave: whether the counts are a property of the mechanism or
  # of the one operating system they were first measured on.
  #
  # Loopback, because a self hosted runner reaching a real bucket needs a credential this workflow
  # does not have and should not have. That understates what a saved request is worth, by roughly the
  # difference between a loopback round trip and a regional one, and the write up says so next to the
  # numbers rather than leaving a reader to assume the endpoint was far away.
  remote-scan:
    name: Remote scan on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: irisgate
      AWS_SECRET_ACCESS_KEY: irisgatesecret
      AWS_REGION: us-east-1
      IRIS_TEST_BUCKET: iris-gate
      MINIO: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: epyc-8c-24gb
            runner: [self-hosted, linux, x64, epyc-8c-24gb]
            jobs: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      # The same image and the same shape as the object storage job in the main workflow, so that a
      # counter measured in one place and a counter measured in the other are measured against the
      # same server.
      - name: An S3 endpoint with a bucket in it
        run: |
          docker rm -f iris-minio-fleet || true
          docker run -d --name iris-minio-fleet -p 9000:9000 \
            -e "MINIO_ROOT_USER=$AWS_ACCESS_KEY_ID" \
            -e "MINIO_ROOT_PASSWORD=$AWS_SECRET_ACCESS_KEY" \
            "$MINIO" server /data
          for _ in $(seq 1 60); do
            docker exec iris-minio-fleet mc ready local && break
            sleep 1
          done
          docker exec iris-minio-fleet mc alias set gate http://127.0.0.1:9000 \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
          docker exec iris-minio-fleet mc mb --ignore-existing "gate/$IRIS_TEST_BUCKET"

      - name: Run the probe
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
        run: >-
          cargo run --release --locked -q -p iris-runtime --features probe --example remote_scan --
          --rows 250000 --repeats 5 --json > remote-scan-${{ matrix.name }}.json

      - name: Show it
        env:
          CARGO_BUILD_JOBS: ${{ matrix.jobs }}
        run: >-
          cargo run --release --locked -p iris-runtime --features probe --example remote_scan --
          --rows 250000 --repeats 5

      - uses: actions/upload-artifact@v7
        with:
          name: remote-scan-${{ matrix.name }}
          path: remote-scan-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: error

      # The probe deletes its own fixtures on the way out. This is for the run that did not get that
      # far, where a container left behind holds a port and a couple of hundred megabytes until
      # somebody notices.
      - name: Clean up after a run that did not
        if: always()
        run: docker rm -f iris-minio-fleet || true

  # The guard cost probe, on the same one machine and for the same reason.
  #
  # This is the run the published number comes from. The hosted matrix in the M2 probe workflow says
  # whether the answer changes character across architectures, which is a question a shared machine
  # can still answer, and a share of a ratio measured next to a neighbour doing something unknown is
  # not a number anybody should quote.
  guard:
    name: Guard cost on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: i9-13900k-64gb
            runner: [self-hosted, windows, x64, i9-13900k-64gb]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        shell: pwsh
        run: ./ci/toolchain.ps1

      - name: Run the probe
        shell: pwsh
        run: |
          cargo run --release --locked -p iris-runtime --features probe --example guard_cost -- --json --samples 1000 > guard-cost-${{ matrix.name }}.json

      - name: Show it
        shell: pwsh
        run: |
          cargo run --release --locked -p iris-runtime --features probe --example guard_cost -- --samples 1000

      - uses: actions/upload-artifact@v7
        with:
          name: guard-cost-${{ matrix.name }}
          path: guard-cost-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: error
