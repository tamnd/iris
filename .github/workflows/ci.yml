name: CI

# Every cache here is read on a pull request and written only on the default branch. GitHub scopes a
# cache to the branch that wrote it, and a pull request branch can read its base branch's caches but
# no other branch can read that pull request's, so saving from a pull request costs it half a minute
# of upload for something nothing else will ever read. Writing from main only means every pull
# request starts from a warm cache and none of them pay to fill one.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  # The promises a compiler cannot keep. A nightly toolchain creeping into a workflow, a patched
  # dependency arriving in a manifest and a hostname landing in a document all make the build work
  # rather than break it, which is exactly why each of them needs something that fails on it.
  #
  # No toolchain and no cache, because it reads files. It finishes in a couple of seconds and it is
  # first in the list so that a run that is going to fail on one of these says so straight away.
  discipline:
    name: Discipline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain, dependencies and machine names
        run: python3 ci/discipline.py

  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-aarch64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # No separate build step. nextest --all-targets builds everything it would have built.
      #
      # Every feature is on because two of them gate tests rather than code. The window's stale read
      # gate needs iris-source's probe to ask the operating system whether an address is readable,
      # and without that feature the test that holds a pointer across a slide is not compiled at all,
      # which is a milestone gate silently not running on the platform it exists for. Which features
      # compile in which combinations is the `features` job's problem, not this one's.
      - name: Test
        run: cargo nextest run --workspace --all-targets --all-features --locked
      - name: Doc tests
        run: cargo test --workspace --doc --all-features --locked

  # The M4 portability gate, which needs somewhere for an object to live.
  #
  # MinIO rather than a mock, because the claim being checked is that a decoder does not know where
  # its bytes came from, and a mock is a thing written by the same people who wrote the code it is
  # standing in for. This talks S3 over HTTP to a server that implements it, with signing, ranged
  # GETs and all the rest, which is the part a mock would quietly skip.
  #
  # Started with `docker run` rather than declared as a service container, which would have been
  # tidier. A service container runs an image's default command and GitHub gives no way to change it,
  # and this image's default command is the server with no arguments, which prints its usage and
  # exits. Reaching for an image whose default happens to be the right one would mean trusting a
  # repackager's conventions to keep a workflow working.
  #
  # The image is pinned to a digest rather than to a tag, which is the opposite of what the actions
  # in this file do. An action is pinned to a major version because its publisher versions it and a
  # patch to it is wanted. This image publishes one moving tag and nothing else, so a tag here would
  # mean a different S3 server every few weeks with no way to tell which one a red run used.
  #
  # One runner, not the four the test matrix uses. The gate is about where the bytes are, and the
  # answer does not depend on which operating system asked. Repeating it on Windows and macOS would
  # cost three more MinIO containers and check the same sentence three more times.
  object-storage:
    name: Object storage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: irisgate
      AWS_SECRET_ACCESS_KEY: irisgatesecret
      AWS_REGION: us-east-1
      IRIS_TEST_BUCKET: iris-gate
      MINIO: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: object-storage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The client comes out of the server image rather than off the network, so this job downloads
      # one thing instead of two and the two halves cannot end up different versions of each other.
      - name: An S3 endpoint with a bucket in it
        run: |
          docker run -d --name iris-minio -p 9000:9000 \
            -e "MINIO_ROOT_USER=$AWS_ACCESS_KEY_ID" \
            -e "MINIO_ROOT_PASSWORD=$AWS_SECRET_ACCESS_KEY" \
            "$MINIO" server /data
          for _ in $(seq 1 60); do
            docker exec iris-minio mc ready local && break
            sleep 1
          done
          docker exec iris-minio mc alias set gate http://127.0.0.1:9000 \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
          docker exec iris-minio mc mb --ignore-existing "gate/$IRIS_TEST_BUCKET"

      # Named rather than run with a bare `--ignored`, for the same reason the fleet workflow names
      # the four gigabyte gate: an ignored test that starts running by accident is a job that fails
      # for a reason nobody asked about, and a named one that disappears is a job that fails saying
      # the name is gone.
      - name: One decoder, a file and an object
        run: >-
          cargo test --locked -p iris-runtime --test portable --
          --ignored --exact
          one_decoder_reads_a_file_and_an_object_and_says_the_same_thing

      - name: Clean up after a run that did not
        if: always()
        run: |
          docker rm -f iris-minio || true
          rm -rf target/gate-object

  # The decoder side of iris is a wasm32 module, so the tree has to keep
  # compiling for a target that has no operating system under it.
  wasm:
    name: wasm32 target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build guest crates for wasm32
        run: cargo build --locked --target wasm32-unknown-unknown -p iris-abi -p iris-decoder --lib --examples

  # iris-abi is the surface that ossifies, so it carries the strictest
  # structural constraint in the tree: no dependencies, and no standard library.
  no-std:
    name: iris-abi builds no_std
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-std
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build for a bare metal target
        run: |
          rustup target add thumbv7em-none-eabi
          cargo build --locked --target thumbv7em-none-eabi -p iris-abi
      # The gate is not that iris-abi has few dependencies. It is that it has none.
      # Every decoder anyone writes carries this crate, so anything it pulls in,
      # everyone pays for, forever, including people who cannot recompile.
      - name: iris-abi must have no dependencies at all
        run: |
          deps=$(cargo tree -p iris-abi --edges normal --prefix none --locked | tail -n +2)
          if [ -n "$deps" ]; then
            echo "iris-abi grew a dependency:"
            echo "$deps"
            exit 1
          fi
          echo "iris-abi depends on nothing."

  features:
    name: Feature combinations
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: hack
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --workspace --feature-powerset --depth 2 --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Check that every crate builds at its declared rust-version
        run: cargo hack check --workspace --rust-version --locked

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --all-features --locked

  miri:
    name: Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Miri builds its own sysroot from source, which is most of this job's runtime and does not
          # live in target/, so rust-cache does not pick it up without being told.
          cache-directories: ~/.cache/miri
      # iris-source is the other crate with unsafe in it and it is deliberately not in this list.
      # Its unsafe is mmap, VirtualAlloc2 and MapViewOfFile3, which Miri has no shims for, so the
      # run would not be a clean pass with nothing found, it would be an error about an unsupported
      # operation on the first test. What stands in for Miri there is the stress test in
      # crates/iris-source/tests/window.rs, which runs on all four platforms in the job above.
      - name: Run Miri over the crates that contain unsafe code
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: |
          rustup override set nightly
          cargo miri test -p iris-abi -p iris-format -p iris-guard

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Collect coverage
        run: cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info
      - name: Summarise
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  # One job for branch protection to require, so adding a matrix entry does not
  # mean editing the protection rules.
  ci:
    name: CI
    if: always()
    needs:
      [
        discipline,
        lint,
        test,
        object-storage,
        wasm,
        no-std,
        features,
        msrv,
        docs,
        miri,
        coverage,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed."
