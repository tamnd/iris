name: CI

# Every cache here is read on a pull request and written only on the default branch. GitHub scopes a
# cache to the branch that wrote it, and a pull request branch can read its base branch's caches but
# no other branch can read that pull request's, so saving from a pull request costs it half a minute
# of upload for something nothing else will ever read. Writing from main only means every pull
# request starts from a warm cache and none of them pay to fill one.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-aarch64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # No separate build step. nextest --all-targets builds everything it would have built.
      - name: Test
        run: cargo nextest run --workspace --all-targets --locked
      - name: Doc tests
        run: cargo test --workspace --doc --locked

  # The decoder side of iris is a wasm32 module, so the tree has to keep
  # compiling for a target that has no operating system under it.
  wasm:
    name: wasm32 target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build guest crates for wasm32
        run: cargo build --locked --target wasm32-unknown-unknown -p iris-abi -p iris-decoder --lib --examples

  # iris-abi is the surface that ossifies, so it carries the strictest
  # structural constraint in the tree: no dependencies, and no standard library.
  no-std:
    name: iris-abi builds no_std
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-std
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build for a bare metal target
        run: |
          rustup target add thumbv7em-none-eabi
          cargo build --locked --target thumbv7em-none-eabi -p iris-abi
      # The gate is not that iris-abi has few dependencies. It is that it has none.
      # Every decoder anyone writes carries this crate, so anything it pulls in,
      # everyone pays for, forever, including people who cannot recompile.
      - name: iris-abi must have no dependencies at all
        run: |
          deps=$(cargo tree -p iris-abi --edges normal --prefix none --locked | tail -n +2)
          if [ -n "$deps" ]; then
            echo "iris-abi grew a dependency:"
            echo "$deps"
            exit 1
          fi
          echo "iris-abi depends on nothing."

  features:
    name: Feature combinations
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: hack
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --workspace --feature-powerset --depth 2 --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Check that every crate builds at its declared rust-version
        run: cargo hack check --workspace --rust-version --locked

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --all-features --locked

  miri:
    name: Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Miri builds its own sysroot from source, which is most of this job's runtime and does not
          # live in target/, so rust-cache does not pick it up without being told.
          cache-directories: ~/.cache/miri
      - name: Run Miri over the crates that contain unsafe code
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: |
          rustup override set nightly
          cargo miri test -p iris-abi -p iris-format -p iris-guard

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Collect coverage
        run: cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info
      - name: Summarise
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  # One job for branch protection to require, so adding a matrix entry does not
  # mean editing the protection rules.
  ci:
    name: CI
    if: always()
    needs: [lint, test, wasm, no-std, features, msrv, docs, miri, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed."
