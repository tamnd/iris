[package]
# The registry slot is irisdb because crates.io holds `iris` on its reserved name list and answers
# any upload of it with a 400. The binary this installs is still called iris, which is the name a
# user types, and every other crate in the workspace is still iris-something.
name = "irisdb"
description = "Command line tool for inspecting, verifying and decoding iris datasets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
anyhow.workspace = true
clap.workspace = true
iris-format.workspace = true
iris-runtime.workspace = true
iris-source.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[[bin]]
name = "iris"
path = "src/main.rs"
