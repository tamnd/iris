[package]
name = "iris-py"
description = "The Python bindings for iris, over the Arrow PyCapsule interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Not on crates.io. What this crate produces is a Python extension module, which nobody installs
# with cargo. It goes to PyPI as a wheel, built by the `Release` workflow.
publish = false

[lib]
# The extension module inside the `iris` package, which is why the leading underscore. The package
# itself is the Python source next to this file, and `python/iris/__init__.py` is what a user
# imports. Naming the cargo library `iris` instead would also collide with `iris-c`, whose shared
# library has that name and would land on the same path in `target`.
name = "_iris"
crate-type = ["cdylib"]
# There are no Rust tests here and there is no way there could be useful ones: everything this crate
# does is call into a Python interpreter that is not running during `cargo test`. The tests are
# `tests/test_iris.py`, run against an installed wheel. Turning the harness off also keeps
# `cargo test --workspace` from trying to link an executable against a libpython that
# `extension-module` deliberately did not link.
test = false
doctest = false

[dependencies]
# The C ABI, called through its safe side rather than through its entry points. Python and C get the
# same open, the same projection rule and the same reopen behaviour because there is one
# implementation of all three and this is a wrapper over it.
iris-c.workspace = true
pyo3.workspace = true

[lints]
workspace = true
