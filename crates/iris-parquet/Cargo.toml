[package]
name = "iris-parquet"
description = "Carries an iris container inside a Parquet file that unmodified readers still read."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Deliberately thin. This crate writes a Parquet file and reads a byte range back out of one, and it
# does not open a container, run a decoder or produce a batch. Keeping the runtime out of the
# dependencies is what lets a reader that has no interest in iris depend on this to find out whether
# a file carries one, and it is why the examples rather than the library are what reach for the host.
[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
iris-format.workspace = true
parquet = { workspace = true, features = ["arrow"] }
thiserror.workspace = true

[dev-dependencies]
# The examples decode a container, which is the host's job rather than this crate's. A
# dev-dependency is dropped when this crate is packaged, so nothing that depends on iris-parquet
# pulls a wasm engine in behind it.
iris-abi.workspace = true
iris-runtime.workspace = true
tempfile.workspace = true

[lints]
workspace = true
