[package]
name = "iris-runtime"
description = "The iris runtime an engine embeds to scan a self-decoding dataset."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-data.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
iris-abi.workspace = true
iris-format.workspace = true
iris-guard.workspace = true
iris-source.workspace = true
iris-trust.workspace = true
iris-vm.workspace = true
thiserror.workspace = true

# iris-trust is here because it owns the one thing that has to happen before a decoder is compiled:
# hashing the module and comparing it to what the container says. This crate never touches the
# module bytes any other way, which is what makes "verification cannot be turned off" a fact about
# the dependency graph rather than a promise in a document.

# iris-source arrived with the windowed path. A container that stays on disk is read through a
# `RangeSource`, and the section the decoder sees is a `Segment` over it, so this crate names the
# trait even though it implements none of it.

# iris-native is not here yet. It is still a stub, and depending on a crate before it does anything
# makes the dependency graph say something that is not true.

# No dev-dependency on iris-decoder even though the gate test uses it. The test builds it for wasm32
# by running cargo, not by linking it, and a dev-dependency would build a second copy of it for the
# host that nothing ever calls.

# The object storage half of the M4 portability gate. These are dev-dependencies and nothing else, so
# a host that embeds this crate to read local files still does not link an HTTP stack or an async
# runtime, which is the promise iris-source makes about its own feature and would be worth very
# little if the runtime above it broke it.
#
# They are also out of the graph under `cfg(loom)`. Loom is turned on through RUSTFLAGS, so it
# reaches every crate that gets built and not only this one, and tokio under that flag compiles
# without `tokio::net`, which hyper below object_store needs. The loom models are about the memory
# pool and have nothing to do with object storage, so the fix is to not build the HTTP stack for
# them rather than to argue with tokio about a flag that was meant for it.
[target.'cfg(not(loom))'.dev-dependencies]
iris-source = { workspace = true, features = ["object-store"] }
object_store = { workspace = true, features = ["aws"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
# Off by default and not API. It exposes the two halves of assembling a batch so the guard cost
# probe can time one against the other. See the `probe` module for why that is a feature rather than
# either public API or a second copy of the assembly path living in the probe.
probe = []

[[example]]
name = "guard_cost"
required-features = ["probe"]

[lints]
workspace = true
