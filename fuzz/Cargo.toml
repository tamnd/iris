[package]
name = "iris-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.13"

iris-abi = { path = "../crates/iris-abi" }
iris-format = { path = "../crates/iris-format" }
iris-guard = { path = "../crates/iris-guard" }

# Arrow is here for the guard target, which builds arrays with Arrow's validation turned off and
# reads them. Versions are written out rather than inherited because this package is excluded from
# the workspace, which is what keeps a sanitizer build of it out of an ordinary `cargo test`.
arrow-array = "59.3.0"
arrow-buffer = "59.3.0"
arrow-data = "59.3.0"
arrow-schema = "59.3.0"

[[bin]]
name = "fuzz_guard"
path = "fuzz_targets/fuzz_guard.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_format"
path = "fuzz_targets/fuzz_format.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
