[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "wasm32-unknown-unknown",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# Nothing copyleft beyond MPL-2.0 gets linked into iris, because iris is meant to
# be embedded inside engines whose licence we do not control.
[[licenses.exceptions]]
name = "unicode-ident"
allow = ["Unicode-DFS-2016"]

# Mozilla's root certificate list, which arrives with the TLS stack that the M4
# object storage gate talks to a bucket through. CDLA-Permissive-2.0 is a licence
# for data rather than for code, it puts no condition on anything that uses the
# data, and this is a list of certificate authorities rather than something that
# gets compiled into iris. It is also reachable only through a dev-dependency, so
# nothing an engine embeds carries it.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # openssl pulls a C dependency and a second TLS stack into a data format
  # library. If TLS is needed, it comes from rustls.
  { name = "openssl" },
  { name = "openssl-sys" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
